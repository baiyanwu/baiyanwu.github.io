<!doctype html>
<html lang="zh-CN" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bai Yanwu</title>
    <meta name="description" content="Bai Yanwu 的个人主站：做过的小工具、改过的项目，以及之后会写的一些文字。" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f2ea" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // 在样式生效前先把「白天 / 夜间」定下来，避免刷新时闪一下
      ;(function () {
        try {
          var saved = localStorage.getItem('baiyanwu.mode')
          var mode =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.mode = mode
          document.documentElement.style.colorScheme = mode
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#121210' : '#f6f2ea')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
