<!doctype html>
<html lang="zh-CN" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bai Yanwu</title>
    <meta name="description" content="Bai Yanwu 的个人主站：做过的小工具、改过的项目，以及之后会写的一些文字。" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f2ea" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d12'/%3E%3Cpath d='M20 18h13c6.6 0 11 3.9 11 9.6 0 3.6-1.7 6.4-4.7 7.9 3.8 1.3 6.1 4.4 6.1 8.4 0 6.4-4.7 10.7-12.1 10.7H20V18zm12.2 14.2c3.1 0 5-1.7 5-4.5s-1.9-4.4-5-4.4h-5.4v8.9h5.4zm.6 15.2c3.6 0 5.7-1.9 5.7-5s-2.1-5-5.7-5h-6v10h6z' fill='%23e8eaf0'/%3E%3C/svg%3E"
    />
    <script>
      // 在样式生效前先把「白天 / 夜间」定下来，避免刷新时闪一下
      ;(function () {
        try {
          var saved = localStorage.getItem('baiyanwu.mode')
          var mode =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.mode = mode
          document.documentElement.style.colorScheme = mode
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#121210' : '#f6f2ea')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
